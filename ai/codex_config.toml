# Codex CLI configuration
# Copied to ~/.codex/config.toml by install.sh

# Reasoning
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"

# No-restriction mode — all actions auto-approved, full access
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Use current sources for on-demand research and other date-sensitive work.
web_search = "live"

# Official OpenAlex connector. Sign in once per host with `codex mcp login openalex`.
# Expose its public research tools; account and author-profile tools are omitted.
[mcp_servers.openalex]
url = "https://mcp.openalex.org/mcp"
enabled_tools = ["search_works", "get_work", "resolve_references", "list_citations", "search_entities", "get_entity", "group_works", "analyze_works", "read_docs"]

# Shell — inherit all env vars so tools like gh, npm, etc. work
[shell_environment_policy]
inherit = "all"

# History — persist sessions, cap at 50MB
[history]
persistence = "save-all"
max_bytes = 52428800

# Notifications on completion
[tui]
notifications = true
animations = true
status_line_use_colors = true
status_line = ["model-with-reasoning", "status", "context-remaining", "used-tokens", "five-hour-limit", "weekly-limit", "estimated-thread-cost", "project-root", "git-branch", "pull-request-number", "branch-changes", "permissions", "approval-mode", "task-progress", "thread-name"]

[projects."/uufs/chpc.utah.edu/common/home/u1446071/.dotfiles"]
trust_level = "trusted"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "~/.local/bin/codex-loop hook"
timeout = 3

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "~/.local/bin/codex-loop hook"
timeout = 3

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "~/.local/bin/codex-loop hook"
timeout = 3

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "~/.local/bin/codex-loop hook"
timeout = 3
